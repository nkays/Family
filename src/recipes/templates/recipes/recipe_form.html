{% extends "recipes/base.html" %}

{% block content %}
  <h2 class="text-2xl font-bold mb-4">Add a Recipe</h2>
  <form method="post" enctype="multipart/form-data" class="bg-white border border-gray-300 rounded-lg p-6 shadow-sm">
    {% csrf_token %}
    <div class="mb-4">
      <label class="block text-gray-700 mb-2">{{ form.title.label }}</label>
      {{ form.title }}
    </div>
    <div class="mb-4">
      <label class="block text-gray-700 mb-2">{{ form.description.label }}</label>
      {{ form.description }}
    </div>
    <div class="mb-4">
      <label class="block text-gray-700 mb-2">{{ form.photo.label }}</label>
      {{ form.photo }}
    </div>
    <div class="mb-4">
      <label class="block text-gray-700 mb-2">{{ form.ingredients.label }}</label>
      {{ form.ingredients }}
    </div>
    <div class="mb-4">
      <label class="block text-gray-700 mb-2">{{ form.instructions.label }}</label>
      {{ form.instructions }}
    </div>
    <div class="mb-4">
      <label class="block text-gray-700 mb-2">{{ form.visibility.label }}</label>
      {{ form.visibility }}
    </div>
    <div class="mb-4">
      <label class="block text-gray-700 mb-2">{{ form.allowed_users.label }}</label>
      {{ form.allowed_users }}
    </div>
    <div class="mb-4">
      <label class="block text-gray-700 mb-2">{{ form.allowed_families.label }}</label>
      {{ form.allowed_families }}
    </div>
    <button type="submit" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">Save Recipe</button>
  </form>
{% endblock %}
