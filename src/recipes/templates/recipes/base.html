{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Family Cookbook</title>
  <link rel="stylesheet" href="{% static 'css/dist/styles.css' %}">
</head>
<body class="bg-gray-100 pt-20">
  <nav class="bg-gray-800 text-white fixed top-0 w-full z-10 shadow-lg">
    <div class="container mx-auto px-4 py-4 flex justify-between items-center">
      <a class="text-xl font-bold" href="{% url 'home' %}">Family Cookbook</a>
      <div class="space-x-4 flex items-center">
        <a class="hover:text-gray-300 transition" href="{% url 'home' %}">Home</a>
        <a class="hover:text-gray-300 transition" href="{% url 'recipes:recipe_list' %}">Recipes</a>
        <a class="hover:text-gray-300 transition" href="{% url 'family_tree:tree' %}">Family Tree</a>
        
        {% if user.is_authenticated %}
          <a class="hover:text-gray-300 transition" href="{% url 'recipes:recipe_create' %}">+ Add Recipe</a>
          {% if user.family_profile %}
            <a class="hover:text-gray-300 transition" href="{% url 'family_tree:member_update' %}">Profile</a>
          {% endif %}
          <a class="hover:text-gray-300 transition" href="{% url 'logout' %}">Logout</a>
        {% else %}
          <a class="hover:text-gray-300 transition" href="{% url 'login' %}">Login</a>
        {% endif %}
      </div>
    </div>
  </nav>

  <main class="container mx-auto px-4 py-8">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
