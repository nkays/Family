{% extends "recipes/base.html" %}

{% block content %}
  <div class="max-w-md mx-auto">
    <div class="bg-white border border-gray-300 rounded-lg shadow-sm p-6">
      <h1 class="text-2xl font-bold mb-4">Log in</h1>
      <form method="post" class="space-y-4">
        {% csrf_token %}
        <div>
          <label class="block text-sm font-medium text-gray-700" for="id_username">Username</label>
          {{ form.username }}
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700" for="id_password">Password</label>
          {{ form.password }}
        </div>

        <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700">
          Sign in
        </button>
      </form>
    </div>
  </div>
{% endblock %}
